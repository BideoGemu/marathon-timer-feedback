name: 🐛 Bug report
description: Something in Marathon-Timer does not work as expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! The more precise you are, the faster it gets fixed.
        🇫🇷 Les signalements en français sont les bienvenus.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem in a few sentences.
      placeholder: "Example: a gifted sub of 5 did not add any time to my timer."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we see the problem ourselves?
      placeholder: |
        1. Go to Time Settings
        2. Set a gifted sub to 60 seconds
        3. Receive a gifted sub on stream
        4. No time is added
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options:
        - Timer overlay (OBS)
        - Dashboard
        - Time Settings
        - Add Time
        - Goals / goals overlay
        - Public goals page
        - Statistics
        - Connections
        - Timer customization
        - Editors
        - Other
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Related platform(s)
      multiple: true
      options:
        - Twitch
        - YouTube
        - Kick
        - TikTok
        - Streamlabs
        - TipeeeStream
        - StreamElements
        - Ko-fi
        - NineStore
        - Not platform-related
    validations:
      required: false

  - type: input
    id: channel
    attributes:
      label: Your channel name
      description: Optional. It helps us find your account and check what happened.
      placeholder: "twitch.tv/yourchannel"
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Browser / OBS version
      placeholder: "Chrome 128, OBS 30.2"
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video
      description: Drag and drop images or a short video here if it helps.
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed every private link and secret from my report (webhook URLs, tokens, sale or Ko-fi links). This page is public.
          required: true
